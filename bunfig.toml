# Vaerion test configuration — coverage floors (OBJ-Q6).
#
# The verify gate runs `bun test tests/ --coverage`; a threshold breach fails
# the run. Floors are measured from the current state (ratchet up, never
# down); they assert the test pyramid actually executes the engine.

[test]
coverage = true
# Ratcheted at MS-3 close (measured 83.37% lines / 88.96% branches; prior
# floor 0.78 set at MS-2). Floors only move up (OBJ-Q6).
coverageThreshold = { lines = 0.80, functions = 0.72, statements = 0.80, branches = 0.85 }
coverageSkipTestFiles = true
