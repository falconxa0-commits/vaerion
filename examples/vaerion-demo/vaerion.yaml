schemaVersion: "0.1"
project:
  name: vaerion-demo
  description: "Vaerion 15-minute demo workspace"
research:
  capabilities:
    - name: demo-docs
      sources:
        - { kind: local, path: "./sources" }
      fencing: untrusted
      maxItems: 100
package:
  include:
    - vaerion.yaml
    - DEMO.md
    - sources
telemetry:
  enabled: false
