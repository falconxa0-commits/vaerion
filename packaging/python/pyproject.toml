[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaerion"
version = "0.1.9-rc1"
description = "Vaerion — the AI-native development engine: deterministic runtime, broker-governed autonomy, hash-chained journals, receipts, and permanent provenance. Evidence, not branding."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Auren", email = "auren@vaerion.dev" }]
keywords = ["ai", "agents", "determinism", "audit", "provenance", "journal", "local-first", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
# Homepage/Changelog URLs are added at the release train ( Founder-gated remote provisioning ).

[project.scripts]
vae = "vaerion.cli:main"

[tool.setuptools]
packages = ["vaerion"]
include-package-data = true

[tool.setuptools.package-data]
vaerion = ["engine/**/*.ts", "engine/**/*.json", "engine/**/*.md"]
