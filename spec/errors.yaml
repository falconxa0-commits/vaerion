# Vaerion — stable diagnostic catalog (ADR-0014).
#
# This file is the single source of truth for E#### codes. The runtime module
# packages/vaerion/src/kernel/errors.ts is the L0 mirror of this catalog;
# verification asserts both stay in sync. Codes are additive-only within v1:
# never reused, never remapped. Ranges:
#   1xxx journal & persistence · 11xx event spine · 12xx configuration
#   13xx permission broker · 14xx research · 15xx runtime/restore
#   16xx surface/usage · 17xx model gateway
#   18xx agents, workflow, evals (MS-4)
#   19xx internal invariants (always engine bugs)
#   20xx local API daemon (MS-5, ADR-0010)
#   21xx extension host (MS-5, ADR-0009 R-2)
#   22xx reproducible bundles / packaging (MS-6, ADR-0016)
version: 1

errors:
  E1000:
    name: journal_lock_held
    summary: "Journal is locked by another writer."
    fix: "Wait for the current writer to finish, or remove the stale lock via `vae journal recover <run>` after confirming no writer is alive."
  E1001:
    name: journal_chain_broken
    summary: "Journal hash chain does not link at the reported record."
    fix: "Run `vae journal verify <run>` for the first broken index; if the damage follows a crash, run `vae journal recover <run>`."
  E1002:
    name: journal_torn_tail
    summary: "Journal ends with an incomplete record (torn write)."
    fix: "Run `vae journal recover <run>` to truncate the torn tail and re-seal the chain."
  E1003:
    name: journal_record_invalid
    summary: "A journal record failed schema validation."
    fix: "Inspect the reported line; restore from backup or quarantine the journal. Never hand-edit records."
  E1004:
    name: journal_append_after_close
    summary: "Attempted to append to a closed journal."
    fix: "Reopen the run with `vae resume <run>` before appending."
  E1005:
    name: journal_seq_gap
    summary: "Journal envelope sequence numbers are not contiguous."
    fix: "Run `vae journal verify <run>`; gaps indicate loss that must be investigated, never papered over."
  E1006:
    name: journal_empty
    summary: "Journal contains no records."
    fix: "Delete the empty journal or re-create the run."
  E1007:
    name: blob_not_found
    summary: "Referenced blob is missing from the content-addressed store."
    fix: "Run `vae doctor` to scan blob integrity; re-produce the blob from its originating step."
  E1008:
    name: blob_digest_mismatch
    summary: "Blob content does not match its digest."
    fix: "The store is corrupt at this ref; restore from backup or re-run the producing step."
  E1009:
    name: journal_export_derivation_invalid
    summary: "Redacted export derivation metadata does not match its records."
    fix: "Re-export from the source journal; never mutate exported files."
  E1100:
    name: envelope_invalid
    summary: "Event envelope failed validation."
    fix: "Check the envelope against spec/schemas/envelope.schema.json; fix the emitting site."
  E1101:
    name: event_type_unknown
    summary: "Event type is not in the registry."
    fix: "Register the type in spec/events/registry.json (additive-only) or fix the emitting site."
  E1102:
    name: envelope_seq_regression
    summary: "Envelope seq went backwards or repeated within a run."
    fix: "Emit through the journal writer, which allocates seq; never allocate seq at call sites."
  E1103:
    name: subscription_cursor_unknown
    summary: "Subscription cursor does not exist in the journal."
    fix: "Resubscribe with a cursor from `vae journal show <run>` or start from `--from-start`."
  E1200:
    name: config_missing
    summary: "vaerion.yaml was not found."
    fix: "Run `vae init` to scaffold a valid project configuration."
  E1201:
    name: config_unknown_key
    summary: "vaerion.yaml contains a key outside the strict schema."
    fix: "Remove the unknown key; Vaerion rejects drift instead of guessing intent."
  E1202:
    name: config_schema_invalid
    summary: "vaerion.yaml violates the v0.1 schema."
    fix: "See spec/schemas/vaerion-yaml.schema.json for the accepted shape."
  E1300:
    name: broker_denied
    summary: "Permission broker denied the requested capability."
    fix: "Inspect the recorded decision (`vae explain <trace>`); request the narrowest needed grant in vaerion.yaml."
  E1301:
    name: broker_fail_closed
    summary: "Broker could not evaluate the request and failed closed."
    fix: "Resolve the underlying broker error; un-evaluable requests are never allowed by law."
  E1302:
    name: gate_pending
    summary: "A durable gate is awaiting human authority."
    fix: "Answer with `vae resume <run> --answer '{...}'`."
  E1303:
    name: gate_already_resolved
    summary: "Gate was already resolved; duplicate resolution refused."
    fix: "Continue the run; the existing resolution is authoritative and journaled."
  E1304:
    name: broker_decision_unjournaled
    summary: "A privileged action lacks a journaled decision."
    fix: "Route the action through the broker contract so decide→journal→act is enforced."
  E1400:
    name: research_source_untrusted
    summary: "Research content is untrusted and was not fenced."
    fix: "Wrap external content with the fencing module before it enters any context."
  E1401:
    name: research_fencing_violation
    summary: "Untrusted content escaped its fence into a trusted channel."
    fix: "Keep untrusted content inside fenced blocks; instructions never mint authority."
  E1402:
    name: research_network_forbidden
    summary: "Research attempted undeclared network access."
    fix: "Declare sources in the research capability; network is a broker-mediated capability, never ambient."
  E1403:
    name: research_capability_not_declared
    summary: "Research action used a capability that was not declared."
    fix: "Declare the capability (and its scope) in the research capability declaration first."
  E1500:
    name: state_restore_failed
    summary: "Run state could not be restored from its journal."
    fix: "Run `vae journal verify <run>`; if the chain is green, report this as a reducer bug."
  E1501:
    name: snapshot_mismatch
    summary: "Checkpoint snapshot does not match journal state at its seq."
    fix: "Discard the snapshot and restore by full replay; snapshots are accelerators, never truth."
  E1502:
    name: run_not_found
    summary: "Run id does not exist in this workspace."
    fix: "List runs with `vae journal ls`."
  E1600:
    name: usage_error
    summary: "Command was invoked incorrectly."
    fix: "Re-run with `--help`; help always teaches and never executes."
  E1601:
    name: provider_unavailable
    summary: "A required provider is unreachable."
    fix: "Check connectivity and provider status, then retry; run `vae doctor` for diagnostics."
  E1602:
    name: partial_with_repair_hint
    summary: "Operation completed partially; a repair path exists."
    fix: "Follow the repair hint in the output, then re-run the failed part."
  E1700:
    name: gateway_model_unknown
    summary: "The requested model is not resolvable to a provider adapter."
    fix: "Use the canonical form provider/model-id (e.g. mockbrain/mock-1) and declare the model under gateway.providers in vaerion.yaml; `vae doctor` lists the capability matrix."
  E1701:
    name: gateway_op_unsupported
    summary: "The provider does not implement the requested operation."
    fix: "Pick a provider whose declared capability matrix covers the op (chat/embed/rerank); the matrix is listed by `vae dev` and `vae doctor`."
  E1702:
    name: gateway_stream_invalid
    summary: "A provider stream violated the normalized stream contract."
    fix: "Compare the response against the recorded cassette for this request; re-record the cassette if the provider drifted, and report the drift."
  E1703:
    name: gateway_budget_exceeded
    summary: "The run budget (tokens or micro-USD) was exceeded."
    fix: "Raise gateway.budgets in vaerion.yaml deliberately or start a new run; spend already journaled is real and is never hidden."
  E1704:
    name: gateway_secret_unresolved
    summary: "A declared secret resolved to nothing at call time (keychain and environment both empty)."
    fix: "Store the value in the OS keychain (service \"vae\", account = the secret name) or export it as an environment variable, then retry; names live in config, values never do."
  E1705:
    name: gateway_breaker_open
    summary: "The provider's circuit breaker is open after repeated failures."
    fix: "Wait for the cooldown and probe again with `vae doctor`; the failures that opened it are journaled and must be investigated, not papered over."
  E1706:
    name: gateway_transport_refused
    summary: "The transport refused the provider call (unreachable, DNS, aborted)."
    fix: "Check connectivity and provider status; the call was broker-authorized, so a repeated refusal is environmental. `vae doctor` reports the breaker state."
  E1800:
    name: agent_plan_invalid
    summary: "The planner produced a plan that does not satisfy the plan contract."
    fix: "Check the planner model's output against the plan JSON shape (steps with kind model|tool|note|context); scripted planners must declare valid steps."
  E1801:
    name: agent_tool_unknown
    summary: "The requested tool is not declared in this workspace."
    fix: "Declare the tool under tools: in vaerion.yaml; undeclared tools are refused fail-closed by the broker pipeline."
  E1802:
    name: agent_tool_args_invalid
    summary: "Tool arguments failed the declared argument shape."
    fix: "Match the tool's declared args schema (JSON object with the expected keys and types); see the tool's declaration in vaerion.yaml."
  E1803:
    name: workflow_dag_invalid
    summary: "The workflow DAG is invalid (cycle, missing dependency, or duplicate node id)."
    fix: "Repair the DAG definition so every dependency references an existing node and the graph is acyclic; `vae run workflow --dag FILE` validates before executing."
  E1804:
    name: agent_step_limit_exceeded
    summary: "The agent reached its step ceiling before completing the goal."
    fix: "Raise agents.maxSteps in vaerion.yaml deliberately, narrow the goal, or resume the run; the steps already journaled are real work and are never hidden."
  E1805:
    name: eval_golden_mismatch
    summary: "An evaluation report or transcript differs from its blessed golden fixture."
    fix: "Re-run the scenario suite; if the change is intended, re-bless with VAE_BLESS=1 and review the diff — golden drift is a contract change, never noise."
  E1806:
    name: citation_enforcement_violation
    summary: "An answer used research context without referencing its citations."
    fix: "Answer with explicit citation references (cit_NNNN from the prepared context pack); unattributed claims over research content are refused by law."
  E1900:
    name: internal_unreachable
    summary: "An internal invariant was violated (engine bug)."
    fix: "File a bug with the trace id; this is never user-caused."
  E1901:
    name: canonical_json_rejected_value
    summary: "Value cannot be canonically serialized (float/undefined/symbol)."
    fix: "Encode the value as an integer or string before journaling; hashed content must be byte-stable."
  E2000:
    name: daemon_auth_required
    summary: "The daemon request lacks the pairing token (or it does not match)."
    fix: "Pass the pairing token printed once at daemon start as 'Authorization: Bearer <token>'; /health, /version and /openapi.json are the only unauthenticated routes."
  E2001:
    name: daemon_bind_refused
    summary: "The daemon refused a non-loopback bind."
    fix: "Bind the daemon to 127.0.0.1 (default), the user runtime unix socket, or a Windows named pipe; remote exposure requires a ratified transport-security ADR, never a flag."
  E2002:
    name: daemon_route_unknown
    summary: "No daemon route matches the method and path."
    fix: "Fetch /openapi.json from the same daemon for the generated route surface; only implemented routes are described."
  E2003:
    name: daemon_run_unknown
    summary: "The requested run id is not known to this daemon workspace."
    fix: "List known runs from the journal directory; run ids are crn_run_* journal names under .vaerion/journal/."
  E2004:
    name: daemon_shutdown_echo_mismatch
    summary: "The shutdown body did not echo the pairing token."
    fix: "POST /shutdown with {\"token\":\"<pairing token>\"} — the echo guard prevents accidental shutdowns; authenticated callers still must echo the token in the body."
  E2005:
    name: daemon_cancel_unavailable
    summary: "The run cannot be cancelled in its current state."
    fix: "Cancellation is defined for runs awaiting a durable gate (the open gate is denied) or for open runs with no live executor; in-flight runs finish their journaled step first."
  E2006:
    name: daemon_nonloopback_refused
    summary: "The wire client refused a non-loopback daemon address."
    fix: "Attach the SDK client to 127.0.0.1, localhost or [::1] only; remote daemon attachment requires a ratified transport-security ADR."
  E2100:
    name: extension_artifact_digest_mismatch
    summary: "The extension artifact does not match its pinned digest."
    fix: "Re-pin the digest in vaerion.yaml only after verifying the artifact's provenance; a mismatched artifact is NEVER executed."
  E2101:
    name: extension_not_declared
    summary: "The extension is not declared in this workspace."
    fix: "Declare the extension under vaerion.yaml extensions: (name, artifact, digest) — declaring it grants nothing; the broker still decides every call."
  E2102:
    name: extension_protocol_violation
    summary: "The extension broke the host protocol (bad handshake, unknown frame, oversized line, or unsolicited response)."
    fix: "Fix the extension to speak the published world (spec/wit/); the host kills the process fail-closed on the first violation."
  E2103:
    name: extension_timeout
    summary: "The extension exceeded its time budget (handshake or call)."
    fix: "Raise extensions.timeoutMs deliberately, or fix the extension's latency; the process is killed and the call fails closed."
  E2104:
    name: extension_spawn_failed
    summary: "The extension artifact could not be spawned (missing, not executable, or crash at exec)."
    fix: "Check the artifact path is an executable file and matches the pinned digest; the R-2 host executes exactly the declared artifact with an empty environment."
  E2200:
    name: vxn_format_invalid
    summary: "The .vxn bundle structure violates the format law (manifest not canonical, entry order not canonical, unsafe path, or malformed stream)."
    fix: "The bundle is not provably reproducible — refuse it. Rebuild from a trusted source with `vae package build`; never hand-edit bundle bytes."
  E2201:
    name: vxn_digest_mismatch
    summary: "A recomputed blake3 digest (payload or entry) does not match the bundle manifest."
    fix: "The bundle was corrupted or tampered with in transit. Refuse the bundle; obtain it from the publisher and re-verify. Never execute unverifiable content."
  E2202:
    name: vxn_pin_mismatch
    summary: "A component pin in the bundle manifest does not equal the pin recorded in vaerion.yaml / vaerion.lock (digest swap)."
    fix: "Refuse the bundle (digest-swap attack per Blueprint §9.4). Re-derive the expected pin from the audited source; only a reviewed lock diff may change a pin."
  E2203:
    name: vxn_unsupported_format
    summary: "The file is not a .vxn bundle (bad magic) or the format version is not supported."
    fix: "Verify the file is a Vaerion bundle produced by `vae package build`. If the format version is newer, upgrade the engine; downgrades are never negotiated."
  E2204:
    name: vxn_input_missing
    summary: "A declared package input is missing, unreadable, or escapes the project root."
    fix: "Fix package.include in vaerion.yaml: paths must exist, stay inside the project, and be relative. Absolute paths and traversal are refused by law."
  E2205:
    name: vxn_lock_mismatch
    summary: "vaerion.lock disagrees with reality (config fingerprint, extension pins, or the recorded bundle digest)."
    fix: "The lock is generated, never hand-edited. Re-run `vae package build` to regenerate vaerion.lock, then review the lock diff before committing."
  E2206:
    name: vxn_verify_failed
    summary: "Bundle verification completed with failures (the detailed per-check report carries each finding)."
    fix: "Treat the bundle as unverified: it must not be imported, distributed, or executed. Rebuild and re-verify; publish only bundles whose verify report is fully green."
  E2300:
    name: repo_not_a_repository
    summary: "The working directory is not inside a Git repository (no .git discovered upward)."
    fix: "Run from inside the repository, or pass --cwd pointing at a checkout; Vaerion measures repositories, it does not invent them."
  E2301:
    name: repo_git_unavailable
    summary: "The git executable is missing or unusable, so repository state cannot be measured."
    fix: "Install git (fail-closed: an unmeasurable repository is an untrusted one), then re-run the command."
  E2302:
    name: repo_merge_conflict
    summary: "The repository is in a merge/rebase/cherry-pick conflict state; the working tree contains unresolved paths."
    fix: "Resolve the conflict markers and `git add` the resolved paths, or abort the in-progress operation; release evaluation refuses a conflicted tree."
  E2303:
    name: repo_identity_violation
    summary: "A commit in the audited range is not authored by the ratified identity (Auren <auren@vaerion.dev>)."
    fix: "History is immutable by law (no rewrites). Record the violation in the worklog; only a Founder-approved decision may change identity governance."
  E2304:
    name: ci_workflow_invalid
    summary: "A workflow file failed structural validation (missing triggers, jobs without steps, missing timeout, or another measured defect)."
    fix: "Fix the listed findings in .github/workflows/; CI is the remote projection of the single verification authority and must stay structurally sound."
  E2305:
    name: ci_verify_authority_missing
    summary: "A workflow job runs gate logic without invoking tools/verify.ts — the single verification authority (D-R)."
    fix: "Make every verification job run `bun run tools/verify.ts`; no surface may re-implement the six gates."
  E2306:
    name: ci_env_if_drift
    summary: "A step's `if:` condition reads a variable defined in that same step's own `env:` — the condition cannot see it and is permanently false."
    fix: "Move the decision into the shell (`if [ -n \"$VAR\" ]; then ... fi`) where the env is real, or hoist the variable to workflow/job level."
  E2307:
    name: ci_unparsable_yaml
    summary: "A workflow file does not parse as YAML, so its pipeline is not provable."
    fix: "Fix the YAML syntax error reported for the file; an unparsable pipeline cannot be validated or simulated."
  E2308:
    name: release_not_ready
    summary: "Release readiness evaluation completed with one or more blockers (the per-check report carries each finding and its Fix)."
    fix: "Clear the listed blockers — measured only: gates, git trust, CI validity, version lockstep, evidence record, artifacts — then re-run `vae release readiness`."
  E2309:
    name: release_version_lockstep_broken
    summary: "Version surfaces disagree (package manifests, CLI VERSION, OpenAPI, packaging descriptors)."
    fix: "Align every version surface to the release version; version lockstep is a release blocker, not a style preference."
  E2310:
    name: release_record_missing_or_stale
    summary: "No parsable verification record (.vaerion-verification.json with ok:true) exists, so gate evidence is absent."
    fix: "Run `bun run tools/verify.ts` to produce the measured record (or `vae release readiness --live-gates` to measure now); fail-closed means no record, no release."
  E2311:
    name: release_tag_binding_missing
    summary: "HEAD is not exactly at a v* tag, so the release would not be reproducibly bound to the packed artifact set."
    fix: "Tag the release commit (`git tag -a v<version> -m ...`) after the tree is clean and gates are green, then pack from the tag."
  E2312:
    name: release_artifacts_missing
    summary: "No packed, signed release artifact set (dist/MANIFEST.json + signature + SHA256SUMS) was found."
    fix: "Pack from the release tag with `bun run tools/dist-pack.ts --ref <tag>` (fail-closed), then verify the consumer set with tools/dist-verify.ts."
