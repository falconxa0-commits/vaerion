# Vaerion — stable diagnostic catalog (ADR-0014).
#
# This file is the single source of truth for E#### codes. The runtime module
# packages/vaerion/src/kernel/errors.ts is the L0 mirror of this catalog;
# verification asserts both stay in sync. Codes are additive-only within v1:
# never reused, never remapped. Ranges:
#   1xxx journal & persistence · 11xx event spine · 12xx configuration
#   13xx permission broker · 14xx research · 15xx runtime/restore
#   16xx surface/usage · 17xx model gateway
#   19xx internal invariants (always engine bugs)
version: 1

errors:
  E1000:
    name: journal_lock_held
    summary: "Journal is locked by another writer."
    fix: "Wait for the current writer to finish, or remove the stale lock via `vae journal recover <run>` after confirming no writer is alive."
  E1001:
    name: journal_chain_broken
    summary: "Journal hash chain does not link at the reported record."
    fix: "Run `vae journal verify <run>` for the first broken index; if the damage follows a crash, run `vae journal recover <run>`."
  E1002:
    name: journal_torn_tail
    summary: "Journal ends with an incomplete record (torn write)."
    fix: "Run `vae journal recover <run>` to truncate the torn tail and re-seal the chain."
  E1003:
    name: journal_record_invalid
    summary: "A journal record failed schema validation."
    fix: "Inspect the reported line; restore from backup or quarantine the journal. Never hand-edit records."
  E1004:
    name: journal_append_after_close
    summary: "Attempted to append to a closed journal."
    fix: "Reopen the run with `vae resume <run>` before appending."
  E1005:
    name: journal_seq_gap
    summary: "Journal envelope sequence numbers are not contiguous."
    fix: "Run `vae journal verify <run>`; gaps indicate loss that must be investigated, never papered over."
  E1006:
    name: journal_empty
    summary: "Journal contains no records."
    fix: "Delete the empty journal or re-create the run."
  E1007:
    name: blob_not_found
    summary: "Referenced blob is missing from the content-addressed store."
    fix: "Run `vae doctor` to scan blob integrity; re-produce the blob from its originating step."
  E1008:
    name: blob_digest_mismatch
    summary: "Blob content does not match its digest."
    fix: "The store is corrupt at this ref; restore from backup or re-run the producing step."
  E1009:
    name: journal_export_derivation_invalid
    summary: "Redacted export derivation metadata does not match its records."
    fix: "Re-export from the source journal; never mutate exported files."
  E1100:
    name: envelope_invalid
    summary: "Event envelope failed validation."
    fix: "Check the envelope against spec/schemas/envelope.schema.json; fix the emitting site."
  E1101:
    name: event_type_unknown
    summary: "Event type is not in the registry."
    fix: "Register the type in spec/events/registry.json (additive-only) or fix the emitting site."
  E1102:
    name: envelope_seq_regression
    summary: "Envelope seq went backwards or repeated within a run."
    fix: "Emit through the journal writer, which allocates seq; never allocate seq at call sites."
  E1103:
    name: subscription_cursor_unknown
    summary: "Subscription cursor does not exist in the journal."
    fix: "Resubscribe with a cursor from `vae journal show <run>` or start from `--from-start`."
  E1200:
    name: config_missing
    summary: "vaerion.yaml was not found."
    fix: "Run `vae init` to scaffold a valid project configuration."
  E1201:
    name: config_unknown_key
    summary: "vaerion.yaml contains a key outside the strict schema."
    fix: "Remove the unknown key; Vaerion rejects drift instead of guessing intent."
  E1202:
    name: config_schema_invalid
    summary: "vaerion.yaml violates the v0.1 schema."
    fix: "See spec/schemas/vaerion-yaml.schema.json for the accepted shape."
  E1300:
    name: broker_denied
    summary: "Permission broker denied the requested capability."
    fix: "Inspect the recorded decision (`vae explain <trace>`); request the narrowest needed grant in vaerion.yaml."
  E1301:
    name: broker_fail_closed
    summary: "Broker could not evaluate the request and failed closed."
    fix: "Resolve the underlying broker error; un-evaluable requests are never allowed by law."
  E1302:
    name: gate_pending
    summary: "A durable gate is awaiting human authority."
    fix: "Answer with `vae resume <run> --answer '{...}'`."
  E1303:
    name: gate_already_resolved
    summary: "Gate was already resolved; duplicate resolution refused."
    fix: "Continue the run; the existing resolution is authoritative and journaled."
  E1304:
    name: broker_decision_unjournaled
    summary: "A privileged action lacks a journaled decision."
    fix: "Route the action through the broker contract so decide→journal→act is enforced."
  E1400:
    name: research_source_untrusted
    summary: "Research content is untrusted and was not fenced."
    fix: "Wrap external content with the fencing module before it enters any context."
  E1401:
    name: research_fencing_violation
    summary: "Untrusted content escaped its fence into a trusted channel."
    fix: "Keep untrusted content inside fenced blocks; instructions never mint authority."
  E1402:
    name: research_network_forbidden
    summary: "Research attempted undeclared network access."
    fix: "Declare sources in the research capability; network is a broker-mediated capability, never ambient."
  E1403:
    name: research_capability_not_declared
    summary: "Research action used a capability that was not declared."
    fix: "Declare the capability (and its scope) in the research capability declaration first."
  E1500:
    name: state_restore_failed
    summary: "Run state could not be restored from its journal."
    fix: "Run `vae journal verify <run>`; if the chain is green, report this as a reducer bug."
  E1501:
    name: snapshot_mismatch
    summary: "Checkpoint snapshot does not match journal state at its seq."
    fix: "Discard the snapshot and restore by full replay; snapshots are accelerators, never truth."
  E1502:
    name: run_not_found
    summary: "Run id does not exist in this workspace."
    fix: "List runs with `vae journal ls`."
  E1600:
    name: usage_error
    summary: "Command was invoked incorrectly."
    fix: "Re-run with `--help`; help always teaches and never executes."
  E1601:
    name: provider_unavailable
    summary: "A required provider is unreachable."
    fix: "Check connectivity and provider status, then retry; run `vae doctor` for diagnostics."
  E1602:
    name: partial_with_repair_hint
    summary: "Operation completed partially; a repair path exists."
    fix: "Follow the repair hint in the output, then re-run the failed part."
  E1700:
    name: gateway_model_unknown
    summary: "The requested model is not resolvable to a provider adapter."
    fix: "Use the canonical form provider/model-id (e.g. mockbrain/mock-1) and declare the model under gateway.providers in vaerion.yaml; `vae doctor` lists the capability matrix."
  E1701:
    name: gateway_op_unsupported
    summary: "The provider does not implement the requested operation."
    fix: "Pick a provider whose declared capability matrix covers the op (chat/embed/rerank); the matrix is listed by `vae dev` and `vae doctor`."
  E1702:
    name: gateway_stream_invalid
    summary: "A provider stream violated the normalized stream contract."
    fix: "Compare the response against the recorded cassette for this request; re-record the cassette if the provider drifted, and report the drift."
  E1703:
    name: gateway_budget_exceeded
    summary: "The run budget (tokens or micro-USD) was exceeded."
    fix: "Raise gateway.budgets in vaerion.yaml deliberately or start a new run; spend already journaled is real and is never hidden."
  E1704:
    name: gateway_secret_unresolved
    summary: "A declared secret resolved to nothing at call time (keychain and environment both empty)."
    fix: "Store the value in the OS keychain (service \"vae\", account = the secret name) or export it as an environment variable, then retry; names live in config, values never do."
  E1705:
    name: gateway_breaker_open
    summary: "The provider's circuit breaker is open after repeated failures."
    fix: "Wait for the cooldown and probe again with `vae doctor`; the failures that opened it are journaled and must be investigated, not papered over."
  E1706:
    name: gateway_transport_refused
    summary: "The transport refused the provider call (unreachable, DNS, aborted)."
    fix: "Check connectivity and provider status; the call was broker-authorized, so a repeated refusal is environmental. `vae doctor` reports the breaker state."
  E1900:
    name: internal_unreachable
    summary: "An internal invariant was violated (engine bug)."
    fix: "File a bug with the trace id; this is never user-caused."
  E1901:
    name: canonical_json_rejected_value
    summary: "Value cannot be canonically serialized (float/undefined/symbol)."
    fix: "Encode the value as an integer or string before journaling; hashed content must be byte-stable."
